<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuis Hukum Indonesia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">

    <!-- MULAI -->
    <section id="screen-start" class="screen active">
      <h1>Kuis Hukum</h1>
      <p class="sub">Uji pengetahuanmu tentang hukum Indonesia. 10 soal acak, lengkap dengan penjelasan di setiap jawaban.</p>
      <button id="btn-start" class="btn">Mulai Kuis</button>
      <p class="best">Skor terbaik: <strong id="best">-</strong></p>
    </section>

    <!-- KUIS -->
    <section id="screen-quiz" class="screen">
      <div class="top">
        <span id="counter">Soal 1/10</span>
        <span id="category" class="tag"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>

      <h2 id="story"></h2>
      <p id="question" class="question"></p>

      <div id="options" class="options"></div>

      <div id="feedback" class="feedback hidden">
        <p id="feedback-title"></p>
        <p id="feedback-text"></p>
        <button id="btn-next" class="btn">Lanjut</button>
      </div>
    </section>

    <!-- HASIL -->
    <section id="screen-result" class="screen">
      <h1>Hasil Kuis</h1>
      <p class="big"><span id="res-score">0</span>/<span id="res-total">10</span></p>
      <p id="res-percent" class="sub"></p>
      <p id="res-message" class="sub"></p>

      <div id="review" class="review"></div>

      <button id="btn-restart" class="btn">Ulangi Kuis</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
